name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Python compiles
        run: python -m compileall -q scripts tests
      - name: Shell syntax
        run: for f in scripts/*.sh scripts/rasora bin/rasora install.sh; do bash -n "$f"; done
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Locked dependencies install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements.lock
