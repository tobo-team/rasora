name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python compiles
        run: python -m compileall -q scripts tests
      - name: Shell syntax
        run: for f in scripts/*.sh scripts/rasora bin/rasora install.sh; do bash -n "$f"; done
      - name: Locked dependencies install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements.lock
      - name: Tests
        run: python -m unittest discover -s tests
      # What a Mac has out of the box. This is the Python users run, not the one above.
      - name: Install and tests on the system Python
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 -m venv "$RUNNER_TEMP/systeme"
          "$RUNNER_TEMP/systeme/bin/pip" install --require-hashes --only-binary=:all: -r scripts/requirements.lock
          "$RUNNER_TEMP/systeme/bin/python" -m unittest discover -s tests
